name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: discourse-atlas validate examples/mini-essay/analysis.json
      - run: discourse-atlas validate benchmark/cases/mill-on-liberty/reference-a.json
      - run: discourse-atlas validate benchmark/cases/mill-on-liberty/reference-b.json

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[pdf]'
      - name: Validate installed CLI outside repository checkout
        run: |
          cd /tmp
          discourse-atlas validate "$GITHUB_WORKSPACE/examples/mini-essay/analysis.json"
          python -m discourse_atlas validate "$GITHUB_WORKSPACE/examples/mini-essay/analysis.json"
          discourse-atlas evaluate "$GITHUB_WORKSPACE/benchmark/cases/mini-essay/gold.json" "$GITHUB_WORKSPACE/benchmark/annotations/mini-essay-b.json" > /tmp/evaluation.json
          discourse-atlas agreement "$GITHUB_WORKSPACE/benchmark/annotations/mini-essay-a.json" "$GITHUB_WORKSPACE/benchmark/annotations/mini-essay-b.json" > /tmp/agreement.json
          discourse-atlas align "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-a.json" "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-b.json" -o /tmp/proposed-alignment.json
          discourse-atlas evaluate "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-a.json" "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-b.json" --alignment "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/alignment-a-b.json" > /tmp/aligned-evaluation.json
          discourse-atlas agreement "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-a.json" "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-b.json" --alignment "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/alignment-a-b.json" > /tmp/aligned-agreement.json
          discourse-atlas multi-evaluate "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-b.json" "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-a.json" "$GITHUB_WORKSPACE/benchmark/cases/mill-on-liberty/reference-b.json" --auto-align > /tmp/multi-evaluation.json
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfWriter
          writer = PdfWriter()
          writer.add_blank_page(width=72, height=72)
          writer.add_blank_page(width=72, height=72)
          with Path('/tmp/smoke.pdf').open('wb') as handle:
              writer.write(handle)
          PY
          discourse-atlas ingest-pdf /tmp/smoke.pdf -o /tmp/smoke.txt --manifest /tmp/smoke.pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/smoke.pages.json').read_text(encoding='utf-8'))
          assert manifest['page_count'] == 2
          assert manifest['empty_page_count'] == 2
          assert Path('/tmp/smoke.txt').read_text(encoding='utf-8') == '\n\f\n'
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Test web model
        working-directory: apps/web
        run: npm test
      - name: Build interactive viewer
        working-directory: apps/web
        run: npm run build
