name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: discourse-atlas validate examples/mini-essay/analysis.json

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: Validate from outside repository checkout
        run: |
          cd /tmp
          discourse-atlas validate "$GITHUB_WORKSPACE/examples/mini-essay/analysis.json"
          python -m discourse_atlas validate "$GITHUB_WORKSPACE/examples/mini-essay/analysis.json"
