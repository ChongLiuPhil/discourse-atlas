name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: discourse-atlas validate examples/mini-essay/analysis.json

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: Validate from outside repository checkout
        run: |
          cd /tmp
          discourse-atlas validate "$GITHUB_WORKSPACE/examples/mini-essay/analysis.json"
          python -m discourse_atlas validate "$GITHUB_WORKSPACE/examples/mini-essay/analysis.json"
          discourse-atlas evaluate "$GITHUB_WORKSPACE/benchmark/cases/mini-essay/gold.json" "$GITHUB_WORKSPACE/benchmark/annotations/mini-essay-b.json" > /tmp/evaluation.json
          discourse-atlas agreement "$GITHUB_WORKSPACE/benchmark/annotations/mini-essay-a.json" "$GITHUB_WORKSPACE/benchmark/annotations/mini-essay-b.json" > /tmp/agreement.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Test web model
        working-directory: apps/web
        run: npm test
      - name: Build interactive viewer
        working-directory: apps/web
        run: npm run build
