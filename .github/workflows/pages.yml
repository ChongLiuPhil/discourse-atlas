name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Test web model
        working-directory: apps/web
        run: npm test
      - name: Build interactive atlas
        working-directory: apps/web
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify hosted atlas
        shell: bash
        run: |
          set -euo pipefail
          site='https://chongliuphil.github.io/discourse-atlas/'
          html=''
          for attempt in {1..12}; do
            if html="$(curl -fsSL "$site")"; then
              break
            fi
            sleep 5
          done
          test -n "$html"
          printf '%s' "$html" | grep -q '<title>Discourse Atlas</title>'
          asset="$(printf '%s' "$html" | grep -oE '/discourse-atlas/assets/[^" ]+\.(js|css)' | head -n 1)"
          test -n "$asset"
          curl -fsSL "https://chongliuphil.github.io${asset}" >/dev/null
          curl -fsSL "${site}example-analysis.json" >/dev/null
          curl -fsSL "${site}example-source.md" >/dev/null
