[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discourse-atlas"
version = "0.8.0"
description = "Validate, align, evaluate, ingest, and render hierarchical discourse dependency graphs produced by the Discourse Atlas skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Discourse Atlas contributors" }]
dependencies = ["jsonschema>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
pdf = ["pypdf>=6.16,<7"]
dev = ["pytest>=8.3,<10", "pypdf>=6.16,<7"]

[project.scripts]
discourse-atlas = "discourse_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
discourse_atlas = ["resources/*.json"]
