  en: "v1.1.1: public protocol and toolkit; the Hosted Interactive Atlas is live on GitHub Pages."

summary:
  zh: >
    一个用于重建复杂文本层级论证结构的开源协议与工具集，区分文本包含层级与论证依赖关系，
    支持证据锚点、结构对齐、评估、人工修正，以及可交互的 Hosted Atlas。
  en: >
    An open-source protocol and toolkit for reconstructing the hierarchical argumentative
    structure of complex texts, separating containment hierarchy from discourse dependencies
    while supporting evidence anchors, alignment, evaluation, human correction, and an
    interactive Hosted Atlas.

